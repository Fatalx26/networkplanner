<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='2' width='20' height='28' rx='2' fill='%231f2937'/%3E%3Crect x='9' y='6' width='14' height='4' rx='1' fill='%233b82f6'/%3E%3Crect x='9' y='13' width='14' height='4' rx='1' fill='%2394a3b8'/%3E%3Crect x='9' y='20' width='14' height='4' rx='1' fill='%2394a3b8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="toggle-left" class="btn panel-toggle" aria-pressed="true" aria-controls="palette">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect class="pane" x="3" y="4" width="5" height="12" rx="1"/></svg>
    </button>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="2" width="20" height="28" rx="2" fill="#2b3340"/><rect x="9" y="6" width="14" height="4" rx="1" fill="#3b82f6"/><rect x="9" y="13" width="14" height="4" rx="1" fill="#94a3b8"/><rect x="9" y="20" width="14" height="4" rx="1" fill="#94a3b8"/></svg>
      Network Planner
    </div>
    <div class="tools">
      <button id="btn-add-rack" class="btn primary">+ Add rack</button>
      <span class="sep"></span>
      <span class="tool-label">Cables</span>
      <div class="seg" id="cable-mode">
        <button data-mode="all" class="on">All</button>
        <button data-mode="selected">Selected</button>
        <button data-mode="none">Hidden</button>
      </div>
      <span class="tool-label">New cable</span>
      <div class="swatches" id="cable-color"></div>
      <span class="sep"></span>
      <div class="zoom">
        <button class="btn icon" id="btn-zoom-out" title="Zoom out">−</button>
        <span id="zoom-label">100%</span>
        <button class="btn icon" id="btn-zoom-in" title="Zoom in">+</button>
      </div>
      <span class="sep"></span>
      <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="btn-export" title="Download layout as JSON">Export</button>
      <label class="btn" title="Load a layout JSON file">Import<input type="file" id="file-import" accept=".json,application/json" hidden></label>
    </div>
    <button id="loop-alert" class="loop-alert" hidden title="Show the network loops"></button>
    <div id="save-status" class="save-status">Loading…</div>
    <button id="toggle-right" class="btn panel-toggle" aria-pressed="true" aria-controls="inspector">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect class="pane" x="12" y="4" width="5" height="12" rx="1"/></svg>
    </button>
  </header>

  <main class="layout">
    <aside class="palette" id="palette"></aside>
    <section class="workspace" id="workspace">
      <div id="canvas-wrap">
        <div id="canvas">
          <div id="racks"></div>
          <svg id="cables" aria-hidden="true"></svg>
        </div>
      </div>
    </section>
    <aside class="inspector" id="inspector"></aside>
  </main>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h3 id="dlg-title"></h3>
      <div id="dlg-fields" class="dlg-fields"></div>
      <menu>
        <button value="cancel" class="btn" formnovalidate>Cancel</button>
        <button value="ok" class="btn primary" id="dlg-ok">Save</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
